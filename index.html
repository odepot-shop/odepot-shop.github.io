<style>
:root{--bg:#faf8f5;--card:#fff;--tx:#1d1d1b;--mut:#6b6b66;--ac:#111;--acx:#fff;--bd:#e7e3dc;--warn:#c2410c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--card:#1f1f1d;--tx:#f2f0ea;--mut:#a09d94;--bd:#33322e;--ac:#f2f0ea;--acx:#141413}}
:root[data-theme="dark"]{--bg:#141413;--card:#1f1f1d;--tx:#f2f0ea;--mut:#a09d94;--bd:#33322e;--ac:#f2f0ea;--acx:#141413}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:80px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--bd);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;z-index:5}
h1{font-size:20px;margin:0}h2{font-size:17px;margin:18px 0 8px}
nav{display:flex;gap:6px;padding:10px 16px;overflow-x:auto}
nav button,.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:20px;padding:8px 14px;font-size:14px;white-space:nowrap}
nav button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
main{padding:0 16px;max-width:720px;margin:0 auto}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden}
.ph{height:140px;display:flex;align-items:center;justify-content:center;font-size:52px;background:var(--bd)}
.ph img{width:100%;height:100%;object-fit:contain;background:#fff}
.pb{padding:10px}.pn{font-weight:600;font-size:15px}.pp{color:var(--ac);font-weight:700;margin:2px 0 8px}
.btn{background:var(--ac);color:var(--acx);border:0;border-radius:10px;padding:10px 14px;font-size:15px;font-weight:600;width:100%}
.btn.s{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;margin:4px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
.qty{display:flex;align-items:center;gap:8px}.qty button{width:30px;height:30px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--bd)}
.mut{color:var(--mut);font-size:13px}.tag{font-size:12px;padding:3px 8px;border-radius:10px;background:var(--bd)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:20}#toast{position:fixed;left:16px;right:16px;bottom:90px;background:#111;color:#fff;border:1px solid #888;padding:12px;border-radius:10px;z-index:30;text-align:center}.logo{width:40px;height:40px;border-radius:50%;flex:none}.hide{display:none}.tot{font-size:18px;font-weight:700}
</style>

var $=function(s){return document.querySelector(s)};

function ld(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var orders=ld("orders",[]);
function fmt(n){return Number(n).toLocaleString("fr-FR")+" "+CFG.devise}
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
var sel={},lastMsg="",lastUrl="";
function say(m){var t=$("#toast");t.textContent=m;t.classList.remove("hide");clearTimeout(say.t);say.t=setTimeout(function(){t.classList.add("hide")},3500)}
function vWa(){return '<h2>Votre commande est prête</h2><p>Appuyez sur le bouton pour l’envoyer sur WhatsApp.</p><a class="btn" style="display:block;text-align:center;text-decoration:none" href="'+lastUrl+'" target="_blank" rel="noopener">Ouvrir WhatsApp</a><p class="mut">Si WhatsApp ne s’ouvre pas, copiez ce message et envoyez-le au +'+CFG.whatsapp+' :</p><textarea rows="8" readonly onclick="this.select()">'+esc(lastMsg)+'</textarea><button class="btn s" id="back">Retour à la boutique</button>'}
function items(){return Object.keys(cart).map(function(k){var a=k.split("|");var p=PRODUITS.filter(function(x){return x.id==a[0]})[0];return {p:p,f:a.slice(1).join("|"),k:k,q:cart[k]}}).filter(function(x){return x.p})}
function total(){return items().reduce(function(t,x){return t+x.p.prix*x.q},0)}
function count(){return items().reduce(function(t,x){return t+x.q},0)}
$("#shop").textContent=CFG.nom;document.title=CFG.nom;

function render(){
  var tabs=admin?[["orders","Commandes"],["clients","Clients"],["add","+ Commande"],["shop","Boutique"]]:[["shop","Boutique"],["cart","Panier ("+count()+")"]];
  $("#tabs").innerHTML=tabs.map(function(t){return '<button data-t="'+t[0]+'" class="'+((admin?atab:tab)==t[0]?"on":"")+'">'+t[1]+'</button>'}).join("");
  $("#tabs").querySelectorAll("button").forEach(function(b){b.onclick=function(){
    if(admin){if(b.dataset.t=="shop"){admin=false;tab="shop"}else atab=b.dataset.t}else tab=b.dataset.t;render()}});
  $("#adm").textContent=admin?"Quitter":"Gestion";
  var bar=$("#bar");
  if(!admin&&tab=="shop"&&count()>0){bar.classList.remove("hide");$("#barbtn").textContent="Voir le panier · "+fmt(total());$("#barbtn").onclick=function(){tab="cart";render()}}else bar.classList.add("hide");
  $("#app").innerHTML=admin?(atab=="orders"?vOrders():atab=="clients"?vClients():vAdd()):(tab=="shop"?vShop():tab=="wa"?vWa():vCart());
  bind();
}
function vShop(){
  var cats=["Tout"].concat(PRODUITS.map(function(p){return p.cat}).filter(function(c,i,a){return a.indexOf(c)==i}));
  var h='<div style="display:flex;gap:6px;overflow-x:auto;margin:6px 0 12px">'+cats.map(function(c){return '<button class="chip" data-c="'+esc(c)+'" style="'+(c==cat?"background:var(--ac);color:var(--acx)":"")+'">'+esc(c)+'</button>'}).join("")+'</div><div class="grid">';
  PRODUITS.filter(function(p){return cat=="Tout"||p.cat==cat}).forEach(function(p){
    h+='<div class="card"><div class="ph">'+(p.img?'<img src="'+p.img+'" alt="" style="background:'+(p.bg||"#fff")+'">':p.emoji)+'</div><div class="pb"><div class="pn">'+esc(p.nom)+'</div><div class="pp">'+fmt(p.prix)+'</div><select data-f="'+p.id+'"><option value="">Choisir la saveur</option>'+SAVEURS.map(function(f){return '<option'+(sel[p.id]==f?" selected":"")+'>'+f+'</option>'}).join("")+'</select><button class="btn" data-add="'+p.id+'">Ajouter</button></div></div>'});
  return h+'</div>';
}
function vCart(){
  if(!count())return '<p class="mut" style="margin-top:20px">Votre panier est vide.</p>';
  var h='<h2>Votre panier</h2>'+items().map(function(x){return '<div class="row"><div><div class="pn">'+esc(x.p.nom)+'</div><div class="mut">'+esc(x.f)+' · '+fmt(x.p.prix)+'</div></div><div class="qty"><button data-m="'+esc(x.k)+'">−</button><b>'+x.q+'</b><button data-plus="'+esc(x.k)+'">+</button></div></div>'}).join("");

}
function nextRef(){return "C"+String(orders.length+1).padStart(3,"0")}
function vOrders(){

  return '<h2>Commandes</h2>'+orders.slice().reverse().map(function(o){var i=orders.indexOf(o);

}
function vClients(){
  var m={};orders.forEach(function(o){var k=o.tel.replace(/\D/g,"")||o.nom;var c=m[k]||(m[k]={nom:o.nom,tel:o.tel,n:0,t:0});c.n++;if(o.statut!="Annulée")c.t+=o.total});
  var l=Object.keys(m).map(function(k){return m[k]}).sort(function(a,b){return b.t-a.t});
  if(!l.length)return '<p class="mut" style="margin-top:20px">Aucun client pour le moment.</p>';
  return '<h2>Clients ('+l.length+')</h2>'+l.map(function(c){return '<div class="row"><div><div class="pn">'+esc(c.nom)+'</div><div class="mut">'+esc(c.tel)+' · '+c.n+' commande(s)</div></div><b>'+fmt(c.t)+'</b></div>'}).join("");
}
function vAdd(){return '<h2>Ajouter une commande reçue</h2><input id="an" placeholder="Nom du client"><input id="ap" type="tel" placeholder="Téléphone"><input id="aa" placeholder="Adresse"><textarea id="ad" rows="3" placeholder="Détail (ex : 2 × Produit 1)"></textarea><input id="at" type="number" inputmode="numeric" placeholder="Montant total"><button class="btn" id="asave" style="margin-top:8px">Enregistrer</button><p class="mut">Les données de gestion sont gardées sur cet appareil : utilisez toujours le même téléphone.</p>'}
function addOrder(o){o.ref=nextRef();o.date=new Date().toLocaleDateString("fr-FR");o.statut="Nouvelle";orders.push(o);sv("orders",orders)}
function bind(){
  document.querySelectorAll("[data-c]").forEach(function(b){b.onclick=function(){cat=b.dataset.c;render()}});
  document.querySelectorAll("[data-f]").forEach(function(e){e.onchange=function(){sel[e.dataset.f]=e.value}});
  document.querySelectorAll("[data-add]").forEach(function(b){b.onclick=function(){var i=b.dataset.add;if(!sel[i]){say("Choisissez d’abord une saveur.");return}var k=i+"|"+sel[i];cart[k]=(cart[k]||0)+1;render()}});
  document.querySelectorAll("[data-plus]").forEach(function(b){b.onclick=function(){cart[b.dataset.plus]++;render()}});
  document.querySelectorAll("[data-m]").forEach(function(b){b.onclick=function(){var i=b.dataset.m;cart[i]--;if(cart[i]<=0)delete cart[i];render()}});
  document.querySelectorAll("[data-st]").forEach(function(s){s.onchange=function(){orders[s.dataset.st].statut=s.value;sv("orders",orders)}});
  document.querySelectorAll("[data-del]").forEach(function(b){b.onclick=function(){if(b.dataset.arm){orders.splice(b.dataset.del,1);sv("orders",orders);render()}else{b.dataset.arm="1";b.textContent="Confirmer ?"}}});
  if($("#back"))$("#back").onclick=function(){tab="shop";render()};
  if($("#send"))$("#send").onclick=function(){
    var n=$("#cn").value.trim(),p=$("#cp").value.trim(),a=$("#ca").value.trim();
    if(!n||!p){say("Merci d’indiquer votre nom et votre téléphone.");return}
    if(!$("#ag").checked){say("La vente est réservée aux personnes majeures (18 ans et +).");return}
    var det=items().map(function(x){return x.q+" × "+x.p.nom+" ("+x.f+")"}).join(", ");
    var o={nom:n,tel:p,adr:a,detail:det,total:total()};addOrder(o);
    var msg="Bonjour, je souhaite commander (réf. "+o.ref+") :\n"+items().map(function(x){return "• "+x.q+" × "+x.p.nom+" ("+x.f+") — "+fmt(x.p.prix*x.q)}).join("\n")+"\n\nTotal : "+fmt(o.total)+"\nNom : "+n+"\nTél : "+p+(a?"\nLivraison : "+a:"")+($("#cm").value.trim()?"\nRemarque : "+$("#cm").value.trim():"");
    lastMsg=msg;lastUrl="https://wa.me/"+CFG.whatsapp+"?text="+encodeURIComponent(msg);
    var w=null;try{w=window.open(lastUrl,"_blank")}catch(e){}
    cart={};tab=w?"shop":"wa";render();
  };
  if($("#asave"))$("#asave").onclick=function(){
    var n=$("#an").value.trim();if(!n){say("Nom requis");return}
    addOrder({nom:n,tel:$("#ap").value.trim(),adr:$("#aa").value.trim(),detail:$("#ad").value.trim(),total:Number($("#at").value)||0});
    atab="orders";render();
  };
}
$("#adm").onclick=function(){
  if(admin){admin=false;tab="shop";render();return}
  $("#pin").classList.remove("hide");$("#pi").value="";$("#pi").focus();
};
$("#pok").onclick=function(){
  if($("#pi").value.trim()===CFG.pin){$("#pin").classList.add("hide");admin=true;atab="orders";render()}else say("Code incorrect");
};
$("#pno").onclick=function(){$("#pin").classList.add("hide")};
$("#pi").onkeydown=function(e){if(e.key==="Enter")$("#pok").onclick()};
render();
</script>
</body>
</html>
